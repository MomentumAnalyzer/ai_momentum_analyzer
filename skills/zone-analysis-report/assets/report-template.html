<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #1a202c; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; line-height: 1.55; background: linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%); }
    main { max-width: 1400px; margin: auto; }
    header, section, .card, .zone, .recommendation, .check { background: #fff; border-radius: 9px; box-shadow: 0 2px 8px #00000012; }
    header { padding: 32px; margin-bottom: 24px; }
    h1 { margin: 0 0 5px; font-size: clamp(1.8rem,4vw,2.6rem); }
    h2 { font-size: 1.35rem; margin: 0 0 16px; }
    h3 { font-size: 1rem; margin: 0 0 8px; }
    .muted, .subtitle { color: #64748b; }
    section { padding: 24px; margin-bottom: 22px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 16px; margin-bottom: 22px; }
    .card { padding: 20px; border-left: 4px solid #3182ce; }
    .card-title, .label { color: #64748b; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
    .card-value { font-size: 1.7rem; font-weight: 650; margin: 6px 0; }
    .alert { border-left: 4px solid #ed8936; }
    .zone { padding: 18px; margin: 12px 0; border-left: 4px solid #38a169; }
    .zone.resistance { border-left-color: #e53e3e; }
    .zone.active { border-left-color: #3182ce; }
    .zone-head, .zone-levels, .metrics { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }
    .zone-head { justify-content: space-between; margin-bottom: 12px; }
    .badge, .status { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 700; background: #edf2f7; }
    .strength-major, .status-conflict { background: #fed7d7; color: #9b2c2c; }
    .strength-moderate, .status-thin { background: #feebc8; color: #975a16; }
    .strength-minor, .status-match { background: #c6f6d5; color: #276749; }
    .metrics { border-top: 1px solid #e2e8f0; margin-top: 12px; padding-top: 12px; }
    .metric { min-width: 90px; }
    .metric strong { display: block; }
    .reading, .recommendation { padding: 14px 16px; margin: 10px 0; }
    .columns { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; vertical-align: top; padding: 10px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f7fafc; }
    .table-wrap { overflow-x: auto; }
    .disclaimer { color: #4a5568; font-size: .9rem; }
    @media (max-width:650px) { body { padding: 12px; } section, header { padding: 18px; } }
    @media print { body { background: #fff; padding: 0; } header, section, .card, .zone, .recommendation { box-shadow: none; break-inside: avoid; } }
  </style>
</head>
<body><main>{{BODY}}</main></body>
</html>
