[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-momentum-analyzer"
version = "0.4.0"
description = "Trading Wiser MCP server and portable Agent Skills. Credentials stay in a private local file."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pranay Vyas" }]

[project.scripts]
tradingwiser-mcp = "mcp_servers.tradingwiser.server:main"
ai-momentum-analyzer = "ai_momentum_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_servers*", "skills*", "ai_momentum_analyzer*"]

[tool.setuptools.package-data]
skills = ["**/*.md", "**/*.json", "**/*.html", "**/*.py"]
